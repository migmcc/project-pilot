[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectpilot"
version = "1.0.0"
description = "Local, deterministic lifecycle orchestrator CLI — a process conductor with explicit approval gates."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Miguel Santos", email = "migmcc@gmail.com" }]
keywords = [
    "cli",
    "workflow",
    "orchestration",
    "lifecycle",
    "project-management",
    "deterministic",
    "skills",
    "agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    # Local/private-first project: never upload to a public package index.
    "Private :: Do Not Upload",
]

[project.urls]
Repository = "https://github.com/migmcc/project-pilot"
Documentation = "https://github.com/migmcc/project-pilot/blob/main/docs/architecture.md"
Changelog = "https://github.com/migmcc/project-pilot/blob/main/CHANGELOG.md"
Issues = "https://github.com/migmcc/project-pilot/issues"

[project.scripts]
pp = "projectpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
