[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectpilot"
version = "0.1.0"
description = "Local, deterministic lifecycle orchestrator CLI."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pp = "projectpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
