name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests (stdlib unittest, no external deps)
        run: python -m unittest discover -s tests -t .
      - name: Run no-automation guard
        run: python -m unittest tests.test_no_automation
